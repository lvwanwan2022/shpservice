<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHP Service API - Swagger文档</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin:0;
            background: #fafafa;
        }
        .swagger-ui .topbar {
            background-color: #2c3e50;
        }
        .swagger-ui .topbar .download-url-wrapper .select-label {
            color: #fff;
        }
        .swagger-ui .topbar .download-url-wrapper input[type=text] {
            border: 2px solid #34495e;
        }
        .swagger-ui .info .title {
            color: #2c3e50;
        }
        .swagger-ui .info .description {
            color: #34495e;
        }
        
        /* 修复Parameters显示问题 */
        .swagger-ui .parameters-container {
            margin: 0 0 20px 0;
            padding: 0;
        }
        
        .swagger-ui .parameters-container .parameter__name {
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }
        
        .swagger-ui .parameters-container .parameter__type {
            color: #666;
            font-size: 12px;
        }
        
        .swagger-ui .parameters-container .parameter__deprecated {
            color: #f93e3e;
        }
        
        .swagger-ui .parameters-container .parameter__required {
            color: #f93e3e;
            font-weight: bold;
        }
        
        .swagger-ui .parameters-container .parameter__in {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .swagger-ui .parameters-container .parameter__description {
            margin: 5px 0;
            color: #333;
            line-height: 1.4;
        }
        
        .swagger-ui .parameters-container .parameter__enum {
            margin: 5px 0;
        }
        
        .swagger-ui .parameters-container .parameter__enum-value {
            display: inline-block;
            background: #f0f0f0;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 3px;
            font-size: 12px;
            color: #333;
        }
        
        /* 确保参数表格完整显示 */
        .swagger-ui .parameters-container table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        
        .swagger-ui .parameters-container th,
        .swagger-ui .parameters-container td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: top;
        }
        
        .swagger-ui .parameters-container th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
        }
        
        /* 修复参数描述换行问题 */
        .swagger-ui .parameters-container .parameter__description {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: none;
        }
        
        /* 确保参数示例完整显示 */
        .swagger-ui .parameters-container .parameter__example {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            margin: 5px 0;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        /* 修复参数默认值显示 */
        .swagger-ui .parameters-container .parameter__default {
            color: #007cba;
            font-weight: bold;
        }
        
        /* 确保参数schema完整显示 */
        .swagger-ui .parameters-container .parameter__schema {
            margin: 5px 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        
        /* 修复响应内容显示 */
        .swagger-ui .responses-wrapper .responses-inner {
            margin: 0;
            padding: 0;
        }
        
        .swagger-ui .responses-wrapper .response-col_status {
            font-weight: bold;
            color: #333;
        }
        
        .swagger-ui .responses-wrapper .response-col_description {
            color: #333;
            line-height: 1.4;
        }
        
        /* 确保所有内容都能完整显示 */
        .swagger-ui .opblock-body {
            overflow: visible;
        }
        
        .swagger-ui .opblock-description-wrapper {
            overflow: visible;
        }
        
        .swagger-ui .opblock-summary-description {
            overflow: visible;
        }
        
        /* 修复可能的截断问题 */
        .swagger-ui .opblock-summary {
            overflow: visible;
        }
        
        .swagger-ui .opblock-summary-method {
            overflow: visible;
        }
        
        /* 确保参数表格不会被截断 */
        .swagger-ui .parameters-container {
            overflow: visible;
            max-width: none;
        }
        
        /* 修复移动端显示 */
        @media (max-width: 768px) {
            .swagger-ui .parameters-container table {
                font-size: 12px;
            }
            
            .swagger-ui .parameters-container th,
            .swagger-ui .parameters-container td {
                padding: 4px 6px;
            }
        }
        
        /* 强制修复参数显示问题 */
        .swagger-ui .parameters-container {
            overflow: visible !important;
            max-width: none !important;
            width: 100% !important;
        }
        
        .swagger-ui .parameters-container table {
            width: 100% !important;
            table-layout: auto !important;
            border-collapse: collapse !important;
        }
        
        .swagger-ui .parameters-container th,
        .swagger-ui .parameters-container td {
            padding: 8px 12px !important;
            text-align: left !important;
            border-bottom: 1px solid #e0e0e0 !important;
            vertical-align: top !important;
            word-wrap: break-word !important;
            white-space: normal !important;
            overflow: visible !important;
        }
        
        .swagger-ui .parameters-container .parameter__description {
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            max-width: none !important;
            overflow: visible !important;
        }
        
        .swagger-ui .opblock-body {
            overflow: visible !important;
        }
        
        .swagger-ui .opblock-description-wrapper {
            overflow: visible !important;
        }
        
        .swagger-ui .opblock-summary {
            overflow: visible !important;
        }
        
        .swagger-ui .opblock-summary-method {
            overflow: visible !important;
        }
        
        .swagger-ui .opblock-summary-description {
            overflow: visible !important;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // 配置Swagger UI
            const ui = SwaggerUIBundle({
                url: '/api/swagger-custom.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                validatorUrl: null,
                docExpansion: 'list',
                filter: true,
                showRequestHeaders: true,
                showCommonExtensions: true,
                tryItOutEnabled: true,
                requestInterceptor: function(request) {
                    // 添加认证头
                    const token = localStorage.getItem('auth_token');
                    if (token) {
                        request.headers['Authorization'] = 'Bearer ' + token;
                    }
                    return request;
                },
                responseInterceptor: function(response) {
                    // 处理响应
                    return response;
                },
                onComplete: function() {
                    // 页面加载完成后的回调
                    console.log('Swagger UI 加载完成');
                    
                    // 确保参数内容完整显示
                    setTimeout(function() {
                        const parameterContainers = document.querySelectorAll('.parameters-container');
                        parameterContainers.forEach(function(container) {
                            container.style.overflow = 'visible';
                            container.style.maxWidth = 'none';
                            container.style.width = '100%';
                        });
                        
                        // 修复参数表格显示
                        const parameterTables = document.querySelectorAll('.parameters-container table');
                        parameterTables.forEach(function(table) {
                            table.style.width = '100%';
                            table.style.tableLayout = 'auto';
                            table.style.borderCollapse = 'collapse';
                        });
                        
                        // 修复参数描述
                        const parameterDescriptions = document.querySelectorAll('.parameter__description');
                        parameterDescriptions.forEach(function(desc) {
                            desc.style.whiteSpace = 'pre-wrap';
                            desc.style.wordWrap = 'break-word';
                            desc.style.maxWidth = 'none';
                            desc.style.overflow = 'visible';
                        });
                        
                        // 修复表格单元格
                        const tableCells = document.querySelectorAll('.parameters-container th, .parameters-container td');
                        tableCells.forEach(function(cell) {
                            cell.style.wordWrap = 'break-word';
                            cell.style.whiteSpace = 'normal';
                            cell.style.overflow = 'visible';
                        });
                        
                        // 强制修复所有可能的截断问题
                        const allElements = document.querySelectorAll('.swagger-ui *');
                        allElements.forEach(function(element) {
                            if (element.style.overflow === 'hidden') {
                                element.style.overflow = 'visible';
                            }
                        });
                        
                        console.log('参数显示修复完成');
                    }, 1000);
                }
            });
            
            // 添加认证功能
            window.ui = ui;
            
            // 添加认证按钮
            const authButton = document.createElement('button');
            authButton.textContent = '设置认证令牌';
            authButton.style.cssText = `
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 9999;
                padding: 8px 16px;
                background: #2c3e50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            `;
            authButton.onclick = function() {
                const token = prompt('请输入JWT认证令牌:');
                if (token) {
                    localStorage.setItem('auth_token', token);
                    alert('认证令牌已设置！');
                }
            };
            document.body.appendChild(authButton);
        };
    </script>
</body>
</html>
