# Nginx 负载均衡配置 for Windows Server
# 适用于多个 Waitress 实例的高可用部署

# 上游服务器组 - 多个Waitress实例
upstream shpservice_backend {
    # 负载均衡算法
    # least_conn;  # 最少连接数算法
    # ip_hash;     # IP哈希算法，保持会话亲和性
    
    # Waitress 实例列表 - 端口递增部署
    server 127.0.0.1:5030 weight=3 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5031 weight=3 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5032 weight=2 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5033 weight=2 max_fails=3 fail_timeout=30s;
    
    # 备用服务器（可选）
    # server 127.0.0.1:5034 backup;
    
    # 健康检查（需要nginx-plus或第三方模块）
    # health_check interval=10s fails=3 passes=2;
}

# 服务器配置
server {
    listen 80;
    listen [::]:80;
    server_name 10.20.148.169 localhost;
    
    # 访问日志
    access_log logs/shpservice_access.log combined;
    error_log logs/shpservice_error.log warn;
    
    # 客户端配置
    client_max_body_size 1G;          # 最大上传文件大小
    client_body_timeout 300s;         # 客户端body超时
    client_header_timeout 60s;        # 客户端header超时
    
    # 代理缓冲区配置
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # 连接和超时配置
    proxy_connect_timeout 60s;        # 连接后端超时
    proxy_send_timeout 300s;          # 发送请求超时
    proxy_read_timeout 300s;          # 读取响应超时
    
    # 保持连接
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    
    # 请求头配置
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # 静态文件缓存（如果有）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "STATIC";
        
        # 尝试本地文件，否则代理到后端
        try_files $uri @proxy_to_app;
    }
    
    # API路由 - 所有/api请求
    location /api/ {
        # 速率限制（可选）
        # limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://shpservice_backend;
        
        # 禁用缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Cache-Status "NOCACHE";
        
        # WebSocket支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 错误页面
        error_page 502 503 504 /50x.html;
    }
    
    # Swagger文档
    location /swagger/ {
        proxy_pass http://shpservice_backend;
        
        # 简单缓存
        proxy_cache_valid 200 5m;
        add_header X-Cache-Status "SWAGGER";
    }
    
    # 文件上传路由
    location /upload {
        # 特殊配置用于大文件上传
        client_max_body_size 5G;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        
        proxy_pass http://shpservice_backend;
        
        # 上传进度支持（需要nginx-upload-progress模块）
        # track_uploads proxied 30s;
    }
    
    # 默认代理所有其他请求
    location / {
        try_files $uri $uri/ @proxy_to_app;
    }
    
    # 代理配置
    location @proxy_to_app {
        proxy_pass http://shpservice_backend;
        
        # 健康检查失败时的错误页面
        error_page 502 503 504 /50x.html;
    }
    
    # 错误页面
    location = /50x.html {
        root html;
        internal;
    }
    
    # 健康检查端点
    location /health {
        access_log off;
        proxy_pass http://shpservice_backend/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }
    
    # Nginx状态页面（可选）
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.20.148.0/24;
        deny all;
    }
}

# WebSocket连接升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 速率限制区域（可选）
# http {
#     limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
#     limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
# }

# HTTPS配置（推荐生产环境）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 10.20.148.169;
    
    # SSL证书配置
    # ssl_certificate /path/to/certificate.crt;
    # ssl_certificate_key /path/to/private.key;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 使用相同的代理配置
    include /etc/nginx/conf.d/shpservice_proxy.conf;
}
